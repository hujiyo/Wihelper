[wihelper]
# 检测阈值 (0.0~1.0)，值越高越不容易误报，但也可能漏检
# 推荐值: 0.8
threshold = 0.8

# 开枪延迟时间（秒），每一枪之间的间隔
# >= 4.0: 大狙模式（单发精确射击，一枪后自动退出瞄准）
# < 4.0: 连狙模式（4秒内最多连续8枪）
# 推荐值: 4.0
fire_cooldown = 4.0

# ONNX 模型文件路径（相对于程序目录，或绝对路径）
model_path = wihelper_model.onnx

# 截图推理目标帧率 (FPS)
# 60: 与屏幕刷新率同步，平衡性能与响应速度
# 30: 省资源模式，适合低端设备
# 推荐值: 60
target_fps = 60
