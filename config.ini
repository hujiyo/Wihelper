[wihelper]
# 检测阈值 (0.0~1.0)，值越高越不容易误报，稳定性更强
# 推荐范围: 0.7-0.9
threshold = 0.8

# 开枪延迟时间（秒），每一枪之间的间隔
# >= 4.0: 大狙模式（单发精确射击，一枪后自动退出瞄准）
# < 4.0: 连狙模式（4秒内最多连续8枪）
# 推荐值: 4.0
fire_cooldown = 4.0

# ONNX 模型文件路径（相对于程序目录，或绝对路径）
# model_path = wihelper_model.onnx
model_path = wihelper_model_fp16.onnx

# 截图推理目标帧率 (FPS)
# 推荐值: 30-120
# 数值越高,需要的资源越多,模型响应的速度越快
# 比如，
# 当FPS>90时,可能对象快速掠过也能更快响应
# 当FPS<45时,可能需要对象处于准心一段时间内才会触发响应
target_fps = 60
